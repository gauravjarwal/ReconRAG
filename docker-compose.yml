services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/app/chroma_data
      - phi_vault:/app/phi_vault
    env_file:
      - .env
    # DISABLE_SSL_VERIFY is read from .env and is off unless you set it there.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 30s
      timeout: 10s
      start_period: 60s   # NER model load on startup
      retries: 3

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      - BACKEND_URL=http://backend:8000
      - BACKEND_API_KEY=${FRONTEND_API_KEY:?set FRONTEND_API_KEY in .env}
      - STREAMLIT_SERVER_MAX_UPLOAD_SIZE=10
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  chroma_data:
  # Holds the encrypted pseudonym->PHI mapping. Back it up separately from
  # chroma_data, and keep PHI_ENCRYPTION_KEY somewhere else entirely.
  phi_vault:
