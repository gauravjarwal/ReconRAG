# ReconRAG v2. `backend/` and `frontend/requirements.txt` are the frozen v1 app.
[project]
name = "reconrag"
version = "2.0.0"
description = "RAG service for messy real-world documents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.16",
    "anthropic>=2.0",
    "beautifulsoup4>=4.12",
    "charset-normalizer>=3.4",
    "cryptography>=44",
    "fastapi>=0.135",
    "fastembed>=0.7",
    "ftfy>=6.3",
    "google-genai>=1.0",
    "langdetect>=1.0.9",
    "lxml>=5",
    "numpy>=1.26",
    "openpyxl>=3.1",
    "pgvector>=0.4",
    "pillow>=10",
    "prometheus-client>=0.21",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pydantic>=2.7",
    "pydantic-settings>=2.6",
    "pymupdf>=1.25",
    "python-docx>=1.1",
    "python-multipart>=0.0.20",
    "redis>=6",
    "rapidocr>=3",
    "onnxruntime>=1.20",
    "sqlalchemy>=2",
    "uvicorn>=0.34",
]

[project.scripts]
reconrag = "reconrag.cli:main"

[project.optional-dependencies]
# NER for names in PHI collections. Needs a model: `make setup-phi`.
phi = ["spacy>=3.8"]
ui = ["httpx>=0.28", "streamlit>=1.40"]

[dependency-groups]
dev = ["httpx>=0.28", "mypy>=1.11", "pytest>=8", "pytest-cov>=5", "ruff>=0.6"]
evals = [
    "pypdf>=5",
    "rank-bm25>=0.2.2",
    "rapidfuzz>=3.9",
    "reportlab>=4.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reconrag"]

[tool.uv]
default-groups = ["dev", "evals"]

# An own workspace root, so uv never attaches this to the parent ai-lab workspace.
[tool.uv.workspace]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "evals/tests"]
pythonpath = [".", "src"]
markers = ["integration: needs real Postgres and Redis"]

[tool.ruff]
line-length = 100
target-version = "py312"
include = ["evals/**/*.py", "src/**/*.py", "tests/**/*.py", "migrations/**/*.py", "frontend/**/*.py"]
# Frozen verbatim from git commit f5cf1b3. A test checks it byte for byte.
extend-exclude = ["evals/baselines/v1_frozen"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Inline CSS and HTML keep these pages to one file with no build step.
"evals/report.py" = ["E501"]
"evals/label.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["evals", "src"]
exclude = ["evals/baselines/v1_frozen", "evals/tests"]
ignore_missing_imports = true
